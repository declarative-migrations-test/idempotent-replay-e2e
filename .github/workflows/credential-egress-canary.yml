name: Credential egress canary

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: credential-egress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false

      - name: Scan every commit introduced by the pull request
        if: ${{ github.event_name == 'pull_request' }}
        uses: gha-indie-worker/.github/credential-egress@6ac40c44882563d7375138a630622c06ddca8c83
        with:
          scope: introduced
          base-ref: ${{ github.event.pull_request.base.sha }}

      - name: Scan the tracked tree outside pull requests
        if: ${{ github.event_name != 'pull_request' }}
        uses: gha-indie-worker/.github/credential-egress@6ac40c44882563d7375138a630622c06ddca8c83
        with:
          scope: tracked

      - name: Exercise the artifact and log adapter
        uses: gha-indie-worker/.github/credential-egress@6ac40c44882563d7375138a630622c06ddca8c83
        with:
          scope: paths
          paths: .github/workflows
