name: dpm-server exact-head certification

on:
  pull_request:
    paths:
      - "candidate-contract/**"
      - ".github/workflows/dpm-server-exact-head.yml"
  push:
    branches: [main]
    paths:
      - "candidate-contract/**"
      - ".github/workflows/dpm-server-exact-head.yml"
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: "Optional full 40-character declarative-postgres-migrate.rs commit SHA"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dpm-server-exact-head-${{ github.ref }}-${{ inputs.candidate_sha || 'pinned' }}
  cancel-in-progress: true

jobs:
  resolve-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      repository: ${{ steps.source.outputs.repository }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out certification contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false

      - name: Resolve immutable source
        id: source
        env:
          CANDIDATE_SHA_OVERRIDE: ${{ inputs.candidate_sha || '' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re

          with open("candidate-contract/dpm-server.json", encoding="utf-8") as stream:
              source = json.load(stream)

          repository = source.get("repository", "")
          expected = "declarative-migrations/declarative-postgres-migrate.rs"
          if repository != expected:
              raise SystemExit(f"unsupported candidate repository: {repository!r}")

          sha = os.environ.get("CANDIDATE_SHA_OVERRIDE", "").strip() or source.get("sha", "")
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("candidate SHA must be exactly 40 lowercase hexadecimal characters")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"repository={repository}\n")
              output.write(f"sha={sha}\n")

          print(f"certifying {repository}@{sha}")
          PY

  formatting:
    needs: resolve-source
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve-source.outputs.repository }}
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
          show-progress: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: rustfmt
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}" && test -z "$(git status --porcelain)"
      - name: Check formatting without rewriting evidence
        run: cargo fmt --all -- --check

  compiler-compatibility:
    needs: resolve-source
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.88.0", "1.89.0", "1.90.0", "1.91.0", "stable"]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve-source.outputs.repository }}
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
          show-progress: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: ${{ matrix.rust }}
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}" && test -z "$(git status --porcelain)"
      - name: Check all targets against the lockfile
        run: |
          rustc --version
          cargo check --locked --all-targets

  unit-and-contract-tests:
    needs: resolve-source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve-source.outputs.repository }}
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
          show-progress: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}" && test -z "$(git status --porcelain)"
      - name: Run all unit and contract tests
        run: cargo test --locked --all-targets

  strict-lint:
    needs: resolve-source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve-source.outputs.repository }}
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
          show-progress: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
          components: clippy
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}" && test -z "$(git status --porcelain)"
      - name: Deny all warnings
        run: cargo clippy --locked --all-targets -- -D warnings

  openapi-contract:
    needs: resolve-source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve-source.outputs.repository }}
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
          show-progress: false
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}" && test -z "$(git status --porcelain)"
      - name: Parse and inspect the versioned OpenAPI document
        run: |
          python3 -m json.tool openapi/dpm-server-v1.json >/dev/null
          python3 - <<'PY'
          import json

          with open("openapi/dpm-server-v1.json", encoding="utf-8") as stream:
              document = json.load(stream)

          assert document["openapi"].startswith("3.")
          assert document["info"]["version"] == "v1"
          for path in ("/healthz", "/readyz", "/version", "/openapi.json", "/v1/diff", "/v1/apply"):
              assert path in document["paths"], path
          PY

  real-process-smoke:
    needs: resolve-source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out immutable candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.resolve-source.outputs.repository }}
          ref: ${{ needs.resolve-source.outputs.sha }}
          persist-credentials: false
          show-progress: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ needs.resolve-source.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}" && test -z "$(git status --porcelain)"
      - name: Build the server
        run: cargo build --locked --bin dpm-server
      - name: Exercise the real HTTP process
        shell: bash
        run: |
          set -euo pipefail
          port="$(python3 - <<'PY'
          import socket
          with socket.socket() as listener:
              listener.bind(("127.0.0.1", 0))
              print(listener.getsockname()[1])
          PY
          )"
          token='server-smoke-token-0123456789'
          export DPM_SERVER_BIND="127.0.0.1:${port}"
          export DPM_SERVER_TOKEN="${token}"
          export DPM_SERVER_DATABASES_JSON='{"primary":"postgres://127.0.0.1:9/unused"}'
          export DPM_SERVER_ALLOW_APPLY=false
          target/debug/dpm-server >server.log 2>&1 &
          server_pid=$!
          trap 'kill "${server_pid}" 2>/dev/null || true; wait "${server_pid}" 2>/dev/null || true' EXIT

          for _ in {1..50}; do
            if curl --silent --fail "http://127.0.0.1:${port}/healthz" >health.json; then
              break
            fi
            sleep 0.1
          done

          python3 - <<'PY'
          import json
          with open("health.json", encoding="utf-8") as stream:
              health = json.load(stream)
          assert health["status"] == "ok"
          assert health["service"] == "dpm-server"
          assert health["api_version"] == "v1"
          PY

          curl --silent --fail "http://127.0.0.1:${port}/openapi.json" >served-openapi.json
          cmp openapi/dpm-server-v1.json served-openapi.json

          cat >diff.json <<'JSON'
          {
            "source": {"kind": "catalog", "catalog": {"format_version": 1, "server_version_num": 0, "database_flavor": "postgres", "schemas": [], "extensions": [], "enums": {}, "sequences": {}, "tables": {}, "views": {}, "functions": {}, "triggers": {}}},
            "target": {"kind": "catalog", "catalog": {"format_version": 1, "server_version_num": 0, "database_flavor": "postgres", "schemas": [], "extensions": [], "enums": {}, "sequences": {}, "tables": {}, "views": {}, "functions": {}, "triggers": {}}}
          }
          JSON

          unauthenticated_status="$(curl --silent --output unauthenticated.json --write-out '%{http_code}' -H 'Content-Type: application/json' --data @diff.json "http://127.0.0.1:${port}/v1/diff")"
          test "${unauthenticated_status}" = 401

          curl --silent --fail -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' --data @diff.json "http://127.0.0.1:${port}/v1/diff" >diff-response.json
          python3 - <<'PY'
          import json
          with open("diff-response.json", encoding="utf-8") as stream:
              response = json.load(stream)
          assert response["api_version"] == "v1"
          assert response["summary"]["change_count"] == 0
          assert response["plan"]["changes"] == []
          PY

          apply_status="$(curl --silent --output apply-disabled.json --write-out '%{http_code}' -H "Authorization: Bearer ${token}" -H 'Content-Type: application/json' --data '{"source":{"kind":"catalog","catalog":{"format_version":1,"server_version_num":0,"database_flavor":"postgres","schemas":[],"extensions":[],"enums":{},"sequences":{},"tables":{},"views":{},"functions":{},"triggers":{}}},"target":"primary","dry_run":false,"confirmation":"apply:primary"}' "http://127.0.0.1:${port}/v1/apply")"
          test "${apply_status}" = 503
          grep -q 'apply_disabled' apply-disabled.json
      - name: Show server log on failure
        if: failure()
        run: cat server.log 2>/dev/null || true
