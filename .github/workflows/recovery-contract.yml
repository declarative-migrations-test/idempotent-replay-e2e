name: deterministic recovery contract

on:
  pull_request:
    paths:
      - recovery-contract.json
      - source-pins.json
      - test-plan.json
      - scripts/validate-recovery-contract.mjs
      - scripts/validate-recovery-contract.test.mjs
      - .github/workflows/recovery-contract.yml
  push:
    branches: [main]
    paths:
      - recovery-contract.json
      - source-pins.json
      - test-plan.json
      - scripts/validate-recovery-contract.mjs
      - scripts/validate-recovery-contract.test.mjs
      - .github/workflows/recovery-contract.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: recovery-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          show-progress: false
          submodules: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - name: Validate syntax and fail-closed recovery invariants
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/validate-recovery-contract.mjs
          node --test scripts/validate-recovery-contract.test.mjs
          node scripts/validate-recovery-contract.mjs
