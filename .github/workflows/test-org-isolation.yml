name: Test-organization isolation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-org-isolation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          show-progress: false
      - name: Enforce test-only resource scope
        uses: gha-indie-worker/.github/test-org-isolation@ef0b0371f64e4532b8bbb5ecc51cf7c4d7c67b99
        with:
          root: .
          repository: ${{ github.repository }}
          source-sha: ${{ github.sha }}
      - name: Upload digest-bound evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-org-isolation-${{ github.sha }}
          path: .test-org-isolation/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
