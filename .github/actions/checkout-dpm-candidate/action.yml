name: Checkout immutable DPM candidate
description: Verify an exact DPM commit and optionally generate an execution-only fresh lockfile

inputs:
  repository:
    description: Candidate repository
    required: true
  sha:
    description: Full 40-character candidate SHA
    required: true
  toolchain:
    description: Rust toolchain to install
    required: true
  components:
    description: Optional comma-separated Rust components
    required: false
    default: ""
  fresh-resolution:
    description: Move the historical lockfile aside and generate an execution-only lockfile
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Check out immutable candidate
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.sha }}
        path: candidate
        persist-credentials: false
        show-progress: false

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    - name: Verify exact candidate checkout
      shell: bash
      working-directory: candidate
      env:
        EXPECTED_SHA: ${{ inputs.sha }}
      run: |
        set -euo pipefail
        test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
        test -z "$(git status --porcelain)"

    - name: Generate execution-only fresh dependency resolution
      if: ${{ inputs['fresh-resolution'] == 'true' }}
      shell: bash
      working-directory: candidate
      run: bash ../candidate-contract/prepare-fresh-resolution.sh
